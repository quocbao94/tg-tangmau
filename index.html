<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tracking MEP tầng mẫu</title>
<link rel="icon" href="assets/ricons-logo.png">
<style>
:root{--red:#e3302d;--blue:#1d5594;--blue-d:#163f6e;--fg:#1f2937;--mut:#6b7280;--line:#d9dee5;--soft:#f4f6f9;--ok:#c6efce;--okf:#006100;--wip:#ffeb9c;--wipf:#9c5700}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Roboto,Arial,Helvetica,sans-serif;background:var(--soft);color:var(--fg)}
header{display:flex;align-items:center;gap:20px;padding:14px 24px;background:#fff;border-bottom:4px solid var(--red);box-shadow:0 1px 4px rgba(0,0,0,.06)}
header img{height:40px;display:block}
header h1{margin:0;padding-left:20px;border-left:2px solid var(--line);font-size:20px;font-weight:800;letter-spacing:.3px;color:var(--blue)}
main{padding:16px 24px 24px}
nav{display:flex;gap:0}
nav button{border:1px solid var(--blue);background:#fff;color:var(--blue);padding:9px 22px;margin:0;border-radius:0;cursor:pointer;font:inherit;font-weight:700;font-size:14px}
nav button+button{border-left:0}
nav button:first-child{border-radius:4px 0 0 0} nav button:last-child{border-radius:0 4px 0 0}
nav button.on{background:var(--blue);color:#fff}
.tab{display:none} .tab.on{display:block}
.wrap{overflow:auto;max-height:calc(100vh - 150px);background:#fff;border:1px solid var(--line);border-top:3px solid var(--blue)}
table{border-collapse:collapse;font-size:12px} th,td{border:1px solid var(--line);padding:5px 7px}
thead th{position:sticky;top:0;background:var(--blue);color:#fff;font-weight:700;z-index:2;white-space:nowrap}
th.nm,td.nm{position:sticky;left:0;background:#fff;min-width:280px;text-align:left;font-weight:700;z-index:1}
thead th.nm{z-index:3;background:var(--blue)}
td.stt,td.cnt{text-align:center;color:var(--mut)} td.cnt{font-weight:700;color:var(--fg)}
td.gd{background:var(--soft);color:var(--blue);text-align:center;font-weight:800;font-size:11px;width:30px} td.gd span{writing-mode:vertical-rl;transform:rotate(180deg)}
tbody tr:hover td:not(.gd){background-color:#f9fbfd} tbody tr:hover td.nm{background:#f9fbfd}
td.v{text-align:center;min-width:56px;height:24px;cursor:pointer;user-select:none;font-weight:700} td.v:hover{outline:2px solid var(--blue);outline-offset:-2px}
tbody tr td.done{background:var(--ok);color:var(--okf)} tbody tr td.wip{background:var(--wip);color:var(--wipf)} td.busy{opacity:.5}
#msg{padding:16px 0;color:var(--mut)} #msg.err{color:var(--red)}
@media (max-width:640px){header{padding:12px 16px;gap:12px} header img{height:28px} header h1{font-size:14px;padding-left:12px} main{padding:12px 16px}}
</style></head><body><header><img src="assets/ricons-logo.png" alt="Ricons"><h1>THE GIÓ RIVERSIDE – TRACKING MEP TẦNG MẪU</h1></header>
<main><nav id="nav"></nav><div id="msg">Đang tải dữ liệu…</div><div id="tabs"></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL='https://klglmrnuqgurtnyflyju.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtsZ2xtcm51cWd1cnRueWZseWp1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM4MDE3MDYsImV4cCI6MjEwOTM3NzcwNn0.v5a2yLaqrtvTN7mkmyB5mYOkJSyriHa1BulSI_uxiS4';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const COLOR={dien:'#7030A0',ctn:'#1565C0',dhkk:'#2E7D32',pccc:'#C62828',chung:'#222'};
const NEXT={'':'wip',wip:'done',done:''};
const MARK={wip:'…',done:'✓'};
const state=new Map(); // "taskId:locId" -> {status,updated_at}
let tasks=[],locs=[],lastUpd=null;

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=d=>{const p=n=>String(n).padStart(2,'0');return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`};

function paintCell(td){
  const st=state.get(td.dataset.k)?.status||'';
  td.className='v'+(st?' '+st:'');td.textContent=MARK[st]||'';
}
function paintCount(taskId){
  const row=document.querySelector(`tr[data-t="${taskId}"]`);if(!row)return;
  const cells=row.querySelectorAll('td.v');
  const n=[...cells].filter(c=>state.get(c.dataset.k)?.status==='done').length;
  row.querySelector('td.cnt').textContent=`${n}/${cells.length}`;
}
function paintUpd(){
  let m=null;for(const v of state.values()){const d=new Date(v.updated_at);if(!m||d>m)m=d}
  const u=document.getElementById('upd');if(u)u.textContent=m?fmt(m):'chưa có cập nhật';
}
function render(areas){
  const nav=document.getElementById('nav'),tabs=document.getElementById('tabs');
  areas.forEach((a,i)=>{
    const L=locs.filter(l=>l.area_code===a.code),T=tasks.filter(t=>t.area_code===a.code);
    const b=document.createElement('button');b.textContent=a.name;b.dataset.t='t'+i;if(!i)b.className='on';nav.appendChild(b);
    let h=`<section id="t${i}" class="tab${i?'':' on'}"><div class="wrap"><table><thead><tr><th class="stt">STT</th><th class="gd">GĐ</th><th class="nm">Nội dung công việc</th><th class="cnt">Đã xong</th>`+
      L.map(l=>`<th class="v">${esc(l.name)}</th>`).join('')+'</tr></thead><tbody>';
    T.forEach((t,j)=>{
      let gd='';
      if(j===0||T[j-1].stage!==t.stage){let n=0;while(T[j+n]&&T[j+n].stage===t.stage)n++;gd=`<td class="gd" rowspan="${n}"><span>${esc(t.stage)}</span></td>`}
      h+=`<tr data-t="${t.id}"><td class="stt">${t.stt}</td>${gd}<td class="nm" style="color:${COLOR[t.discipline]}">${esc(t.name)}</td><td class="cnt"></td>`+
        L.map(l=>`<td class="v" data-k="${t.id}:${l.id}"></td>`).join('')+'</tr>';
    });
    tabs.insertAdjacentHTML('beforeend',h+'</tbody></table></div></section>');
  });
  nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button,.tab').forEach(e=>e.classList.remove('on'));b.classList.add('on');document.getElementById(b.dataset.t).classList.add('on')});
  document.querySelectorAll('td.v').forEach(paintCell);
  tasks.forEach(t=>paintCount(t.id));paintUpd();
  tabs.addEventListener('click',onClick);
}
const timers=new Map();
function onClick(e){
  const td=e.target.closest('td.v');if(!td)return;
  const k=td.dataset.k,task_id=+k.split(':')[0];
  const next=NEXT[state.get(k)?.status||''];
  if(next)state.set(k,{status:next,updated_at:new Date().toISOString()});else state.delete(k);
  paintCell(td);paintCount(task_id);td.classList.add('busy');
  // bấm nhanh nhiều lần thì chỉ lưu trạng thái cuối
  clearTimeout(timers.get(k));timers.set(k,setTimeout(()=>save(k,td),500));
}
async function save(k,td){
  timers.delete(k);
  const [task_id,location_id]=k.split(':').map(Number),st=state.get(k)?.status||'';
  const r=st
    ?await sb.from('progress').upsert({task_id,location_id,status:st,updated_at:new Date().toISOString()})
    :await sb.from('progress').delete().match({task_id,location_id});
  if(timers.has(k))return; // đã bấm tiếp trong lúc lưu
  td.classList.remove('busy');
  if(r.error){
    const g=await sb.from('progress').select('status,updated_at').match({task_id,location_id}).maybeSingle();
    if(g.data)state.set(k,g.data);else if(!g.error)state.delete(k);
    paintCell(td);paintCount(task_id);alert('Không lưu được: '+r.error.message);return;
  }
  paintUpd();
}
function onRealtime(p){
  const row=p.eventType==='DELETE'?p.old:p.new,k=`${row.task_id}:${row.location_id}`;
  if(p.eventType==='DELETE')state.delete(k);else state.set(k,{status:row.status,updated_at:row.updated_at});
  const td=document.querySelector(`td.v[data-k="${k}"]`);if(td){paintCell(td);paintCount(row.task_id)}
  paintUpd();
}
(async()=>{
  const msg=document.getElementById('msg');
  try{
    const [a,l,t,p]=await Promise.all([
      sb.from('areas').select('*').order('sort'),
      sb.from('locations').select('*').order('sort'),
      sb.from('tasks').select('*').order('stt'),
      sb.from('progress').select('task_id,location_id,status,updated_at')]);
    const err=[a,l,t,p].find(r=>r.error);if(err)throw err.error;
    locs=l.data;tasks=t.data;p.data.forEach(r=>state.set(`${r.task_id}:${r.location_id}`,r));
    msg.remove();render(a.data);
    sb.channel('progress').on('postgres_changes',{event:'*',schema:'public',table:'progress'},onRealtime).subscribe();
  }catch(e){msg.className='err';msg.textContent='Không tải được dữ liệu: '+(e.message||e)}
})();
</script>
</body></html>
