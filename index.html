  if(selType==='v'&&td.dataset.k===selKey){td.classList.add('sel');td.appendChild(fh)}

}
const addDays=(iso,n)=>{const d=new Date(iso+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};

function autoDate(m,lid){if(!m.base_id)return null;const b=effDate(miles.find(x=>x.id===m.base_id),lid).date;return b?addDays(b,m.offset_days||0):null}
function effDate(m,lid){const d=hand.get(`${m.id}:${lid}`);return d?{date:d,auto:false}:{date:autoDate(m,lid),auto:true}}
// Căn có ngày bàn giao mốc đầu tiên lên trước, sớm trước muộn sau; cùng ngày hoặc chưa có ngày thì theo thứ tự căn
function sortedLocs(code){
  const m0=miles[0]?.id;
  return locs.filter(l=>l.area_code===code).sort((x,y)=>{
    const dx=hand.get(`${m0}:${x.id}`),dy=hand.get(`${m0}:${y.id}`);
    if(dx&&dy&&dx!==dy)return dx<dy?-1:1;
    if(!!dx!==!!dy)return dx?-1:1;
    return x.sort-y.sort;
  });
}
function renderArea(i){
  const a=areas[i],L=sortedLocs(a.code),T=tasks.filter(t=>t.area_code===a.code);
  let h='<table><thead><tr><th class="stt">STT</th><th class="gd">GĐ</th><th class="nm">Nội dung công việc</th><th class="seq">Trình tự</th><th class="cnt">Đã xong</th>'+
    L.map(l=>`<th class="v">${esc(l.name)}</th>`).join('')+'</tr></thead><tbody>';
  const msRows=list=>{let h='';list.forEach((m,j)=>{
    const gd=j?'':`<td class="gd ms" rowspan="${list.length}" title="XD bàn giao">${list.length>2?'<span>XD BÀN GIAO</span>':'XD'}</td>`;
    const n=L.filter(l=>effDate(m,l.id).date).length;
    h+=`<tr class="ms" data-m="${m.id}"><td class="stt"></td>${gd}<td class="nm">${esc(m.name)}</td><td></td><td class="cnt">${n}/${L.length}</td>`+
      L.map(l=>{const {date:d,auto}=effDate(m,l.id);const cls=d?(auto?' auto':' set'):'';
        const tt=d?(auto?`Mặc định ${dmy(d)} (${miles.find(x=>x.id===m.base_id).name.toLowerCase()} + ${m.offset_days} ngày) · bấm để sửa`:'Nhận bàn giao '+dmy(d)):'Bấm để điền ngày nhận bàn giao';
        return `<td class="h${cls}" data-h="${m.id}:${l.id}" title="${tt}">${ddmm(d)}</td>`}).join('')+'</tr>';
  });return h};
  const M=miles.filter(m=>!m.area_code||m.area_code===a.code); // mốc của khu vực này
  h+=msRows(M.filter(m=>!m.before_stage));
  T.forEach((t,j)=>{
    let gd='';
    if(j===0||T[j-1].stage!==t.stage)h+=msRows(M.filter(m=>m.before_stage===t.stage));

    h+=`<tr data-t="${t.id}"><td class="stt">${t.stt}</td>${gd}<td class="nm" style="color:${COLOR[t.discipline]}">${esc(t.name)}</td><td class="seq" title="Bấm để sửa trình tự">${t.seq??''}</td><td class="cnt"></td>`+
      L.map(l=>`<td class="v" data-k="${t.id}:${l.id}"></td>`).join('')+'</tr>';
  });
  const wrap=document.querySelector(`#t${i} .wrap`),sx=wrap.scrollLeft,sy=wrap.scrollTop;
  wrap.innerHTML=h+'</tbody></table>';wrap.scrollLeft=sx;wrap.scrollTop=sy;
  wrap.querySelectorAll('td.v').forEach(paintCell);T.forEach(t=>paintCount(t.id));markSel();
}
const dmyToday=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()}`};

function closeH(){if(popH.contains(document.activeElement))document.activeElement.blur();popH.style.display='none';curH=null}
popHD.onchange=()=>{if(!curH)return;const [mid,lid]=curH.split(':').map(Number),def=autoDate(miles.find(x=>x.id===mid),lid);
  setHand(curH,popHD.value&&popHD.value!==def?popHD.value:null)}; // trùng ngày mặc định thì không lưu riêng
document.getElementById('popHX').onclick=()=>{if(curH){setHand(curH,null);closeH()}};
document.addEventListener('mousedown',e=>{if(curH&&!popH.contains(e.target)&&!e.target.closest('td.h'))closeH()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeH()});
const handBusy=new Set();
async function setHand(k,date){
  const [milestone_id,location_id]=k.split(':').map(Number),prev=hand.get(k);
  if((prev||null)===date)return;
  if(date)hand.set(k,date);else hand.delete(k);
  const keep=curH;rerenderLoc(location_id);
  if(keep){const td=document.querySelector(`td.h[data-h="${keep}"]`);if(td)onHandClick({target:td})}
  handBusy.add(k);
  const r=date
    ?await sb.from('handovers').upsert({milestone_id,location_id,date,updated_at:new Date().toISOString()})
    :await sb.from('handovers').delete().match({milestone_id,location_id});
  handBusy.delete(k);
  if(r.error){if(prev)hand.set(k,prev);else hand.delete(k);rerenderLoc(location_id);alert('Không lưu được: '+r.error.message)}
}
function onHandRealtime(p){
  const row=p.eventType==='DELETE'?p.old:p.new,k=`${row.milestone_id}:${row.location_id}`;
  if(handBusy.has(k))return;
  if(p.eventType==='DELETE')hand.delete(k);else hand.set(k,row.date);
  if(curH!==k)rerenderLoc(row.location_id);
}
const pop=document.getElementById('pop'),popD=document.getElementById('popD'),popP=document.getElementById('popP');let cur=null;
function openPop(td){
  cur=td;openedAt=Date.now();const [tid,lid]=td.dataset.k.split(':').map(Number);
  const t=tasks.find(x=>x.id===tid),l=locs.find(x=>x.id===lid),v=state.get(td.dataset.k);
  document.getElementById('popT').textContent=`${l.name} · ${t.name}`;
  pop.querySelectorAll('button.s').forEach(b=>b.classList.toggle('on',b.dataset.s===(v?.status||'')));
  popD.value=v?.deadline||'';popP.value=v?.pct??'';popD.disabled=popP.disabled=v?.status!=='wip';
  closeH();placePop(pop,td);
}
function closePop(){if(pop.contains(document.activeElement))document.activeElement.blur();pop.style.display='none';cur=null}
function onClick(e){if(e.target===fh)return;const td=e.target.closest('td.v');if(td){select(td);openPop(td)}}
document.addEventListener('mousedown',e=>{if(cur&&!pop.contains(e.target)&&!e.target.closest('td.v'))closePop()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePop()});
let openedAt=0;
document.addEventListener('scroll',e=>{if(Date.now()-openedAt>400&&e.target!==document&&!pop.contains(e.target)&&!popH.contains(e.target)){if(cur)closePop();if(curH)closeH()}},true);
pop.querySelectorAll('button.s').forEach(b=>b.onclick=()=>{
  const st=b.dataset.s,td=cur;
  if(st==='wip'){const o=state.get(td.dataset.k);setCell(td,{status:'wip',deadline:o?.status==='wip'?o.deadline:null,pct:o?.status==='wip'?o.pct:null});openPop(td);popP.focus()}
  else{setCell(td,st?{status:st,deadline:null}:null);closePop()}
});
const readPct=()=>popP.value===''?null:Math.min(100,Math.max(0,Math.round(+popP.value)));
popD.onchange=popP.onchange=()=>{if(cur&&state.get(cur.dataset.k)?.status==='wip'){const pct=readPct();popP.value=pct??'';setCell(cur,{status:'wip',deadline:popD.value||null,pct})}};
popP.onkeydown=e=>{if(e.key==='Enter')popP.onchange()};
const chains=new Map();
function setCell(td,val){
  const k=td.dataset.k,task_id=+k.split(':')[0];
  if(val)state.set(k,{...val,updated_at:new Date().toISOString()});else state.delete(k);
  paintCell(td);paintCount(task_id);td.classList.add('busy');
  // các lần lưu của cùng một ô chạy lần lượt, mỗi lần gửi trạng thái mới nhất
  const run=(chains.get(k)||Promise.resolve()).then(()=>send(k)).catch(e=>fail(k,td,e));
  chains.set(k,run);
  run.then(()=>{if(chains.get(k)===run){chains.delete(k);td.classList.remove('busy');paintUpd()}});
}
async function send(k){
  const [task_id,location_id]=k.split(':').map(Number),v=state.get(k);
  const r=v
    ?await sb.from('progress').upsert({task_id,location_id,status:v.status,deadline:v.deadline||null,pct:v.pct??null,updated_at:new Date().toISOString()})
    :await sb.from('progress').delete().match({task_id,location_id});
  if(r.error)throw r.error;
}
async function fail(k,td,e){
  const [task_id,location_id]=k.split(':').map(Number);
  const g=await sb.from('progress').select('status,deadline,pct,updated_at').match({task_id,location_id}).maybeSingle();
  if(g.data)state.set(k,g.data);else if(!g.error)state.delete(k);
  paintCell(td);paintCount(task_id);alert('Không lưu được: '+(e.message||e));
}
function onSeqClick(e){
  const td=e.target.closest('td.seq');if(!td||td.querySelector('input'))return;
  const id=+td.parentElement.dataset.t,t=tasks.find(x=>x.id===id),old=t.seq;
  const inp=document.createElement('input');inp.type='number';inp.min=1;inp.value=old??'';
  td.textContent='';td.appendChild(inp);inp.focus();inp.select();
  let done=false;
  const finish=async save=>{
    if(done)return;done=true;
    const v=inp.value.trim()===''?null:Math.max(1,Math.round(+inp.value));
    td.textContent=(save?v:old)??'';
    if(!save||v===old)return;
    t.seq=v;td.classList.add('busy');
    const r=await sb.from('tasks').update({seq:v}).eq('id',id);
    td.classList.remove('busy');
    if(r.error){t.seq=old;td.textContent=old??'';alert('Không lưu được: '+r.error.message)}
  };
  inp.onkeydown=e=>{if(e.key==='Enter')finish(true);else if(e.key==='Escape')finish(false)};
  inp.onblur=()=>finish(true);
}
function onTaskRealtime(p){
  const t=tasks.find(x=>x.id===p.new.id);if(!t)return;t.seq=p.new.seq;
  const td=document.querySelector(`tr[data-t="${t.id}"] td.seq`);if(td&&!td.querySelector('input'))td.textContent=t.seq??'';
}
// ===== Kéo ô để copy (fill handle như Excel) =====
let selKey=null,selType=null;const fh=document.createElement('div');fh.className='fh';fh.title='Kéo để copy sang các ô khác';
const cellOf=(t,k)=>document.querySelector(t==='v'?`td.v[data-k="${k}"]`:`td.h[data-h="${k}"]`);
function markSel(){
  document.querySelectorAll('td.sel').forEach(t=>t.classList.remove('sel'));
  const td=selKey&&cellOf(selType,selKey);if(!td){fh.remove();return}
  td.classList.add('sel');td.appendChild(fh);
}
function select(td){if(td.matches('td.v')){selType='v';selKey=td.dataset.k}else{selType='h';selKey=td.dataset.h}markSel()}
function fillRange(src,el){
  if(!el||el===src)return[];
  if(selType==='h'){const tr=src.parentElement;return el.parentElement===tr?between([...tr.querySelectorAll('td.h')],src,el):[]}
  const rows=[...src.closest('tbody').querySelectorAll('tr[data-t]')],r0=rows.indexOf(src.parentElement),r1=rows.indexOf(el.parentElement);
  const cols=tr=>[...tr.querySelectorAll('td.v')],c0=cols(rows[r0]).indexOf(src),c1=cols(rows[r1]).indexOf(el);
  if(r1<0||c1<0)return[];
  if(Math.abs(c1-c0)>=Math.abs(r1-r0))return between(cols(rows[r0]),src,cols(rows[r0])[c1]);
  const lo=Math.min(r0,r1),hi=Math.max(r0,r1);return rows.slice(lo,hi+1).map(tr=>cols(tr)[c0]).filter(td=>td!==src);
}
function between(list,a,b){const i=list.indexOf(a),j=list.indexOf(b);if(i<0||j<0)return[];return list.slice(Math.min(i,j),Math.max(i,j)+1).filter(td=>td!==a)}
fh.addEventListener('pointerdown',e=>{
  e.preventDefault();e.stopPropagation();closePop();closeH();
  const src=fh.parentElement,wrap=src.closest('.wrap'),type=selType;
  let px=e.clientX,py=e.clientY,range=[],raf=0;
  document.body.classList.add('filling');
  const paint=next=>{range.forEach(td=>td.classList.remove('fillr'));range=next;range.forEach(td=>td.classList.add('fillr'))};
  const update=()=>{const el=document.elementFromPoint(px,py)?.closest(type==='v'?'td.v':'td.h');if(el&&wrap.contains(el))paint(fillRange(src,el))};
  const loop=()=>{ // tự cuộn khi kéo sát mép bảng
    const r=wrap.getBoundingClientRect(),nm=wrap.querySelector('thead th.nm').getBoundingClientRect(),th=wrap.querySelector('thead').getBoundingClientRect(),m=40;
    const sp=(d)=>Math.ceil(Math.min(m,Math.max(0,m-d))/3);
    const dx=px>r.right-m?sp(r.right-px):px<nm.right+m?-sp(px-nm.right):0;
    const dy=py>r.bottom-m?sp(r.bottom-py):py<th.bottom+m?-sp(py-th.bottom):0;
    if(dx||dy){wrap.scrollBy(dx,dy);update()}
    raf=requestAnimationFrame(loop);
  };
  const move=ev=>{px=ev.clientX;py=ev.clientY;update()};
  const up=()=>{
    cancelAnimationFrame(raf);removeEventListener('pointermove',move);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);
    document.body.classList.remove('filling');const cells=range;paint([]);
    if(cells.length)(type==='v'?fillV:fillH)(src,cells);
  };
  addEventListener('pointermove',move);addEventListener('pointerup',up);addEventListener('pointercancel',up);
  raf=requestAnimationFrame(loop);
});
// --- ô tiến độ ---
function fillV(src,cells){
  const v=state.get(src.dataset.k),keys=cells.map(td=>td.dataset.k);
  const prev=keys.map(k=>[k,state.get(k)]);
  keys.forEach(k=>{if(v)state.set(k,{status:v.status,deadline:v.deadline??null,pct:v.pct??null,updated_at:new Date().toISOString()});else state.delete(k)});
  repaintV(keys);saveV(keys);
  toast(`Đã copy sang ${keys.length} ô`,()=>{prev.forEach(([k,o])=>o?state.set(k,o):state.delete(k));repaintV(keys);saveV(keys)});
}
function repaintV(keys){const ts=new Set();keys.forEach(k=>{const td=cellOf('v',k);if(td)paintCell(td);ts.add(+k.split(':')[0])});ts.forEach(paintCount)}
async function saveV(keys){
  const p=(async()=>{
    keys.forEach(k=>cellOf('v',k)?.classList.add('busy'));
    const now=new Date().toISOString(),ups=[],dels=new Map();
    keys.forEach(k=>{const [task_id,location_id]=k.split(':').map(Number),v=state.get(k);
      if(v)ups.push({task_id,location_id,status:v.status,deadline:v.deadline||null,pct:v.pct??null,updated_at:now});
      else{if(!dels.has(task_id))dels.set(task_id,[]);dels.get(task_id).push(location_id)}});
    const rs=await Promise.all([...(ups.length?[sb.from('progress').upsert(ups)]:[]),...[...dels].map(([t,ls])=>sb.from('progress').delete().eq('task_id',t).in('location_id',ls))]);
    const err=rs.find(r=>r.error);
    if(err){ // lỗi thì lấy lại trạng thái thật từ server
      const ids=[...new Set(keys.map(k=>+k.split(':')[0]))],lids=[...new Set(keys.map(k=>+k.split(':')[1]))];
      const g=await sb.from('progress').select('task_id,location_id,status,deadline,pct,updated_at').in('task_id',ids).in('location_id',lids);
      if(!g.error){keys.forEach(k=>state.delete(k));g.data.forEach(r=>{const k=`${r.task_id}:${r.location_id}`;if(keys.includes(k))state.set(k,r)})}
      alert('Không lưu được: '+err.error.message);
    }
  })();
  keys.forEach(k=>chains.set(k,p));
  await p.catch(()=>{});
  keys.forEach(k=>{if(chains.get(k)===p)chains.delete(k);cellOf('v',k)?.classList.remove('busy')});
  repaintV(keys);paintUpd();
}
// --- ô ngày bàn giao ---
function fillH(src,cells){
  const [mid,lid0]=src.dataset.h.split(':').map(Number),m=miles.find(x=>x.id===mid),d=effDate(m,lid0).date;
  const keys=cells.map(td=>td.dataset.h),prev=keys.map(k=>[k,hand.get(k)]);
  keys.forEach(k=>{const lid=+k.split(':')[1],def=autoDate(m,lid);if(d&&d!==def)hand.set(k,d);else hand.delete(k)});
  rerenderLoc(lid0);saveH(keys);
  toast(`Đã copy sang ${keys.length} ô`,()=>{prev.forEach(([k,o])=>o?hand.set(k,o):hand.delete(k));rerenderLoc(lid0);saveH(keys)});
}
async function saveH(keys){
  keys.forEach(k=>handBusy.add(k));
  const mid=+keys[0].split(':')[0],now=new Date().toISOString(),ups=[],dels=[];
  keys.forEach(k=>{const lid=+k.split(':')[1],d=hand.get(k);if(d)ups.push({milestone_id:mid,location_id:lid,date:d,updated_at:now});else dels.push(lid)});
  const rs=await Promise.all([...(ups.length?[sb.from('handovers').upsert(ups)]:[]),...(dels.length?[sb.from('handovers').delete().eq('milestone_id',mid).in('location_id',dels)]:[])]);
  keys.forEach(k=>handBusy.delete(k));
  const err=rs.find(r=>r.error);
  if(err){const g=await sb.from('handovers').select('milestone_id,location_id,date').eq('milestone_id',mid);
    if(!g.error){keys.forEach(k=>hand.delete(k));g.data.forEach(r=>hand.set(`${r.milestone_id}:${r.location_id}`,r.date))}
    rerenderLoc(+keys[0].split(':')[1]);alert('Không lưu được: '+err.error.message)}
}
// --- phím Delete / Backspace: xóa nội dung ô đang chọn ---
addEventListener('keydown',e=>{
  if((e.key!=='Delete'&&e.key!=='Backspace')||!selKey||e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.target.closest('input,textarea,select,[contenteditable]'))return; // đang gõ trong ô nhập thì để yên
  const td=cellOf(selType,selKey);if(!td)return;
  e.preventDefault();closePop();closeH();
  if(selType==='v'){
    const k=selKey,prev=state.get(k);if(!prev)return;
    state.delete(k);repaintV([k]);saveV([k]);
    toast('Đã xóa nội dung ô',()=>{state.set(k,prev);repaintV([k]);saveV([k])});
  }else{
    const k=selKey,prev=hand.get(k),[mid,lid]=k.split(':').map(Number),m=miles.find(x=>x.id===mid);
    if(!prev){if(m.base_id&&autoDate(m,lid))toast('Ô đang dùng ngày mặc định, không có gì để xóa');return}
    hand.delete(k);rerenderLoc(lid);saveH([k]);
    toast(m.base_id?'Đã xóa ngày sửa tay, về ngày mặc định':'Đã xóa ngày bàn giao',()=>{hand.set(k,prev);rerenderLoc(lid);saveH([k])});
  }
});
// --- thông báo + hoàn tác ---
let toastTimer=0;
function toast(msg,undo){
  const t=document.getElementById('toast'),u=document.getElementById('toastU');
  document.getElementById('toastT').textContent=msg;t.style.display='flex';
  u.style.display=undo?'':'none';u.onclick=()=>{t.style.display='none';undo&&undo();toast('Đã hoàn tác')};
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.style.display='none',undo?8000:2500);
}
function onRealtime(p){
  const row=p.eventType==='DELETE'?p.old:p.new,k=`${row.task_id}:${row.location_id}`;
  if(chains.has(k))return; // ô này đang lưu từ máy mình, bỏ qua tín hiệu dội về
  if(p.eventType==='DELETE')state.delete(k);else state.set(k,{status:row.status,deadline:row.deadline,pct:row.pct,updated_at:row.updated_at});
  const td=document.querySelector(`td.v[data-k="${k}"]`);if(td){paintCell(td);paintCount(row.task_id)}
  paintUpd();
}
(async()=>{
  const msg=document.getElementById('msg');
  try{
    const [a,l,t,p,m,h]=await Promise.all([
      sb.from('areas').select('*').order('sort'),
      sb.from('locations').select('*').order('sort'),
      sb.from('tasks').select('*').order('stt'),
      sb.from('progress').select('task_id,location_id,status,deadline,pct,updated_at'),
      sb.from('milestones').select('*').order('sort'),
      sb.from('handovers').select('milestone_id,location_id,date')]);
    const err=[a,l,t,p,m,h].find(r=>r.error);if(err)throw err.error;
    areas=a.data;miles=m.data;h.data.forEach(r=>hand.set(`${r.milestone_id}:${r.location_id}`,r.date));
    locs=l.data;tasks=t.data;p.data.forEach(r=>state.set(`${r.task_id}:${r.location_id}`,r));
    msg.remove();render();
    sb.channel('progress').on('postgres_changes',{event:'*',schema:'public',table:'progress'},onRealtime).on('postgres_changes',{event:'UPDATE',schema:'public',table:'tasks'},onTaskRealtime).on('postgres_changes',{event:'*',schema:'public',table:'handovers'},onHandRealtime).subscribe();
  }catch(e){msg.className='err';msg.textContent='Không tải được dữ liệu: '+(e.message||e)}
})();
</script>
